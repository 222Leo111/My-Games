  .welcome {
    width: min(900px, 100%);
    padding: clamp(30px, 7vw, 76px) clamp(20px, 5vw, 56px);
    text-align: center;
    border: 1px solid rgba(199, 239, 255, .48);
    border-radius: 30px;
    background: rgba(12, 95, 174, .10);
    box-shadow: 0 20px 60px rgba(30, 79, 130, .16), inset 0 1px 0 rgba(255,255,255,.36);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  h1 {
    margin: 0 0 28px;
    font-size: clamp(2.15rem, 7vw, 5.7rem);
    line-height: 1.05;
    letter-spacing: .035em;
    font-weight: 900;
    color: rgba(78, 190, 255, .42);
    -webkit-text-fill-color: rgba(77, 190, 255, .40);
    -webkit-text-stroke: 1.6px rgba(220, 248, 255, .96);
    text-shadow:
      0 1px 0 rgba(255,255,255,.88),
      0 0 9px rgba(110, 215, 255, .95),
      0 0 24px rgba(31, 157, 255, .76),
      0 5px 0 rgba(15, 93, 166, .30);
    filter: drop-shadow(0 8px 12px rgba(0, 74, 145, .24));
  }
  .message {
    margin: 0;
    font-size: clamp(1.1rem, 3.4vw, 1.8rem);
    font-weight: 750;
    letter-spacing: .015em;
    color: rgba(95, 198, 255, .54);
    -webkit-text-fill-color: rgba(95, 198, 255, .54);
    -webkit-text-stroke: .7px rgba(230, 249, 255, .98);
    text-shadow: 0 0 10px rgba(96, 202, 255, .95), 0 3px 7px rgba(0, 70, 130, .25);
  }
  .coming {
    margin: 18px 0 0;
    font-size: clamp(.95rem, 2.5vw, 1.2rem);
    font-weight: 650;
    color: rgba(81, 184, 255, .62);
    -webkit-text-fill-color: rgba(81, 184, 255, .62);
    -webkit-text-stroke: .45px rgba(226, 247, 255, .95);
    text-shadow: 0 0 8px rgba(100, 204, 255, .85);
  }
  @media (max-width: 480px) {
    body { padding: 14px; }
    .welcome { border-radius: 22px; }
    h1 { letter-spacing: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .welcome { animation: appear .75s ease-out both; }
    @keyframes appear { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
  }
</style>
</head>
<body>
  <main class="welcome" aria-label="Welcome">
    <h1>MY WEBSITE</h1>
    <p class="message">Welcome to my website!</p>
    <p class="coming">More coming soon...</p>
  </main>
</body>
