<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cozy Sandbox</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#101428;font:14px ui-rounded,system-ui,sans-serif;color:#fff}
canvas{display:block}
.btn{background:#1a1f3acc;border:1px solid #fff4;color:#fff;border-radius:14px;padding:10px 14px;font:inherit;font-size:16px}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center}
#status{padding:8px 12px;background:#1a1f3acc;border-radius:14px}
#plist{position:fixed;top:48px;left:8px;background:#1a1f3aee;border-radius:12px;padding:10px 12px;font-size:13px;display:none;z-index:5;width:min(320px,92vw);max-height:70vh;overflow:auto}
#plist,#plist *{touch-action:pan-y}
#hint{position:fixed;top:56px;left:8px;background:#1a1f3a99;padding:6px 10px;border-radius:10px;font-size:12px;max-width:260px}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff9;border-radius:50%;pointer-events:none}
#chat{position:fixed;left:8px;bottom:60px;width:min(340px,72vw)}
#log{max-height:140px;overflow-y:auto;touch-action:pan-y;font-size:13px;text-shadow:0 1px 2px #000}
#log div{background:#1a1f3a99;margin-top:2px;padding:3px 8px;border-radius:8px;user-select:text}
#emo{display:flex;gap:4px;margin-top:4px}
#emo .btn{padding:4px 8px;font-size:16px}
#chatin{width:100%;margin-top:4px;padding:8px;border-radius:10px;border:1px solid #fff5;background:#000a;color:#fff;font-size:16px;user-select:text;display:none}
#bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.sw{width:34px;height:34px;border-radius:9px;border:3px solid #fff3}
.sw.on{border-color:#fff;transform:translateY(-4px)}
.lbl{position:fixed;transform:translate(-50%,-100%);text-align:center;pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000;white-space:nowrap}
.lbl b{display:block}
.lbl i{display:none;background:#fffe;color:#111;font-style:normal;padding:3px 8px;border-radius:10px;margin-bottom:2px;max-width:200px;white-space:normal;text-shadow:none}
#touch{display:none}
body.mobile #touch{display:block}
body.mobile #chat{bottom:230px}
body.mobile #emo{display:none}
#joy{position:fixed;left:20px;bottom:80px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff4}
#knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#fff7}
#acts{position:fixed;right:14px;bottom:80px;display:grid;grid-template-columns:repeat(2,64px);gap:8px}
#acts .btn{padding:16px 0;text-align:center}
#tube{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#tube,#tube *{touch-action:pan-y}
#tube .box{background:#1a1f3a;padding:14px;border-radius:18px;width:min(560px,96vw);max-height:94vh;max-height:94dvh;overflow:auto;display:grid;gap:8px;overscroll-behavior:contain}
#tube video{width:100%;max-height:38vh;border-radius:12px;background:#000}
#tube iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
#tube .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#tube input{flex:1;min-width:0;padding:8px;border-radius:8px;border:0;font-size:16px;user-select:text}
#tube .btn{padding:6px 10px;font-size:14px}
#tube .btn.on{background:#fff;color:#111}
#tube .item{background:#ffffff14;border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
#tube .item div{min-width:0;overflow-wrap:anywhere;user-select:text}
#tlist{display:grid;gap:4px;max-height:220px;overflow:auto}
#set{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
#set,#set *{touch-action:pan-y}
#set input[type=range]{touch-action:pan-x}
#set .box{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#1a1f3a;padding:18px;border-radius:18px;width:min(360px,92vw);max-height:85vh;max-height:85dvh;overflow:auto;display:grid;gap:10px}
#set label{display:grid;gap:4px;font-size:13px}
#set input,#set select{padding:8px;border-radius:8px;border:0;font-size:16px;user-select:text;touch-action:auto}
</style></head><body>
<div id="top"><div id="status">Connecting…</div><div style="display:flex;gap:6px"><button class="btn" id="brec" title="Record">🔴</button><button class="btn" id="btube">📺</button><button class="btn" id="bset">⚙️</button></div></div>
<div id="plist"></div><div id="hint"></div><div id="cross"></div>
<div id="chat"><div id="log"></div>
<div id="emo"><button class="btn">👋</button><button class="btn">😀</button><button class="btn">❤️</button><button class="btn">😂</button></div>
<input id="chatin" maxlength="200" placeholder="Say something…"></div>
<div id="bar"></div>
<div id="touch"><div id="joy"><div id="knob"></div></div>
<div id="acts"><button class="btn" id="bjump">⬆️</button><button class="btn" id="bchat">💬</button><button class="btn" id="bplace">➕</button><button class="btn" id="brem">➖</button></div></div>
<div id="tube"><div class="box">
<div class="row" style="justify-content:space-between"><b style="font-size:17px">📺 Cozy Tube</b><button class="btn" id="tclose">Close</button></div>
<div class="row"><button class="btn" id="tup">⬆️ Upload video</button><button class="btn" id="trec">🔴 Record gameplay</button><input type="file" id="tfile" accept="video/*" hidden></div>
<div id="tstat" style="font-size:13px;opacity:.9"></div>
<div id="tnew" style="display:none;gap:8px"><video id="tprev" controls playsinline></video><div class="row"><input id="ttitle" maxlength="80" placeholder="Give it a title"><button class="btn" id="tgo">Post</button><button class="btn" id="tdis">Discard</button></div></div>
<video id="tvid" controls playsinline style="display:none"></video>
<div id="tinfo"></div>
<div class="row"><button class="btn" id="ttab1">🎬 Videos</button><button class="btn" id="ttab2">💬 Comments</button></div>
<div id="tlist"></div>
<div class="row" id="tcrow"><input id="tcin" maxlength="200" placeholder="Add a comment…"><button class="btn" id="tpost">Post</button></div>
</div></div>
<div id="set"><div class="box"><h3 style="margin:0">Settings</h3>
<label>Name<input id="sname" maxlength="16"></label>
<label>Avatar color<input id="scol" type="color"></label>
<label>Controls<select id="smode"><option value="auto">Auto-detect</option><option value="pc">PC (keyboard + mouse)</option><option value="mobile">Mobile (touch)</option><option value="pad">Controller</option></select></label>
<label>Look sensitivity<input id="ssens" type="range" min=".3" max="2.5" step=".1"></label>
<label>Shadows<select id="ssh"><option value="1">On</option><option value="0">Off (faster)</option></select></label>
<label>View distance<input id="sfog" type="range" min="40" max="250" step="10"></label>
<div style="display:flex;gap:8px"><button class="btn" id="ssave">Save and reload</button><button class="btn" id="sclose">Close</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>if(!window.Peer){document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')}</script>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PAL = [0xe8d9b5, 0xc0583f, 0x6b8f71, 0x4a7fb5, 0xe0b84c, 0x8a6bb0, 0x4a4a52, 0xf4f4f0];
let S = { name: 'Guest' + (Math.random() * 900 + 100 | 0), color: '#ff9f5a', mode: 'auto', sens: 1, shadows: true, fog: 120 };
try { Object.assign(S, JSON.parse(localStorage.getItem('cozy') || '{}')); } catch (e) {}

// ---------- platform UI ----------
let pad = false;
function mode() {
  if (S.mode !== 'auto') return S.mode;
  if (pad) return 'pad';
  return (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) ? 'mobile' : 'pc';
}
function applyMode() {
  const m = mode();
  document.body.className = m;
  $('hint').textContent = {
    pc: 'T = Cozy Tube · WASD move · Space jump · Click to lock mouse · Left click place · Right click remove · Enter chat · 1-8 colors',
    mobile: 'Left stick moves · Drag the right side to look · ➕ places, ➖ removes',
    pad: 'Left stick move · Right stick look · A jump · RT place · LT remove'
  }[m];
  $('cross').style.display = m === 'mobile' ? 'block' : 'block';
}
addEventListener('gamepadconnected', () => { pad = true; applyMode(); });
applyMode();

// ---------- three.js ----------
const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = S.shadows;
document.body.prepend(R.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87ceeb, 20, S.fog);
const cam = new THREE.PerspectiveCamera(65, 1, .1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x446644, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 1);
sun.castShadow = S.shadows; sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = sc.bottom = -30; sc.right = sc.top = 30; sc.far = 150;
scene.add(sun, sun.target);
function resize() { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .9, ...o });
const mk = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
const flat = o => { o.rotation.x = -Math.PI / 2; o.castShadow = false; return o; };
const grass = flat(mk(new THREE.CircleGeometry(60, 64), std(0x5da04a)));
flat(mk(new THREE.CircleGeometry(65, 64), std(0xe3d29a), 0, -.1, 0));
const water = flat(mk(new THREE.CircleGeometry(600, 32), std(0x2a6fa8, { roughness: .2, metalness: .1, transparent: true, opacity: .85 }), 0, -.3, 0));

// trees (seeded so everyone sees the same island)
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const trunkG = new THREE.CylinderGeometry(.2, .3, 2, 6), leafG = new THREE.ConeGeometry(1.3, 3, 7), trunkM = std(0x6b4a2f), leafM = std(0x2f7d3a);
for (let i = 0; i < 70; i++) {
  const a = rnd() * 6.283, r = 10 + rnd() * 46, x = Math.cos(a) * r, z = Math.sin(a) * r, s = .8 + rnd() * .7;
  mk(trunkG, trunkM, x, s, z).scale.setScalar(s);
  mk(leafG, leafM, x, s * 3.2, z).scale.setScalar(s);
}

// blocks
const blocks = new Map(), bG = new THREE.BoxGeometry(1, 1, 1), bM = PAL.map(c => std(c, { roughness: .7 }));
const key = (x, y, z) => x + ',' + y + ',' + z;
function setBlock(x, y, z, c) {
  const k = key(x, y, z), o = blocks.get(k);
  if (o) { scene.remove(o); blocks.delete(k); }
  if (c != null) { const m = mk(bG, bM[c], x + .5, y + .5, z + .5); m.userData = { x, y, z, c }; blocks.set(k, m); }
}

// avatars + labels
function avatar(color) {
  const g = new THREE.Group(), m = std(color);
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.32, .32, .9, 12), m); b.position.y = .55;
  const h = new THREE.Mesh(new THREE.SphereGeometry(.28, 16, 12), std(0xffe0c0)); h.position.y = 1.32;
  const e = new THREE.Mesh(new THREE.BoxGeometry(.3, .08, .1), std(0x222222)); e.position.set(0, 1.36, -.26);
  g.add(b, h, e); g.traverse(o => o.castShadow = true); scene.add(g); return g;
}
const labels = {};
function mkLabel(id, name) {
  const d = document.createElement('div'); d.className = 'lbl'; d.innerHTML = '<i></i><b></b>';
  d.querySelector('b').textContent = name; document.body.appendChild(d); labels[id] = d;
}
function say(id, text) {
  const d = labels[id]; if (!d) return;
  const i = d.querySelector('i'); i.textContent = text; i.style.display = 'block';
  clearTimeout(d.t); d.t = setTimeout(() => i.style.display = 'none', 5000);
}
const me = { x: 0, y: 0, z: 6, vy: 0, ry: 0, g: avatar(S.color) };
const others = {};
mkLabel('me', S.name);
function addOther(p) {
  if (others[p.id]) return;
  const o = others[p.id] = { name: p.name, g: avatar(p.color), x: p.x, y: p.y, z: p.z, ry: p.ry };
  o.g.position.set(o.x, o.y, o.z); mkLabel(p.id, p.name); updCount();
}
function delOther(id) { const o = others[id]; if (!o) return; scene.remove(o.g); labels[id].remove(); delete labels[id]; delete others[id]; updCount(); }

// ---------- chat ----------
let chatLog = [];
try { chatLog = JSON.parse(localStorage.getItem('cozychat') || '[]'); } catch (e) {}
function remember(n, t) { chatLog.push({ n, t }); if (chatLog.length > 200) chatLog.shift(); try { localStorage.setItem('cozychat', JSON.stringify(chatLog)); } catch (e) {} }
function showHist(h) { $('log').replaceChildren(); h.forEach(x => logMsg(x.n, x.t)); }
function logMsg(n, t) {
  const d = document.createElement('div'), b = document.createElement('b');
  b.textContent = n + ': '; d.append(b, t);
  const L = $('log'); L.append(d); while (L.children.length > 100) L.firstChild.remove(); L.scrollTop = L.scrollHeight;
}
function sendChat(t) {
  t = t.trim(); if (!t) return;
  if (net) net({ t: 'chat', text: t }); else { logMsg(S.name, t); remember(S.name, t); say('me', t); }
}
const ci = $('chatin'); let typing = false;
function openChat() { document.exitPointerLock && document.exitPointerLock(); ci.style.display = 'block'; ci.focus(); }
ci.onfocus = () => typing = true;
ci.onblur = () => { typing = false; ci.style.display = 'none'; };
document.querySelectorAll('#emo .btn').forEach(b => b.onclick = () => sendChat(b.textContent));
$('bchat').onclick = openChat;

// ---------- network (peer-to-peer: first player in a room hosts) ----------
const VERSION = '2026-10-12-r1';
const diag = [], dlog = m => { diag.push(new Date().toLocaleTimeString() + ' ' + m); if (diag.length > 60) diag.shift(); };
let net = null, myId = null, hostMode = false, hostConn = null, netText = 'Connecting…';
function report() {
  const ice = (hostConn && hostConn.peerConnection && hostConn.peerConnection.iceConnectionState) || '-';
  return ['Version: ' + VERSION, 'Page: ' + location.href, 'Multiplayer library loaded: ' + (typeof Peer !== 'undefined'), 'Role: ' + (hostMode ? 'HOST' : net ? 'GUEST' : 'SOLO'),
    'Status: ' + netText, 'Last problem: ' + (lastErr || 'none'), 'Players here: ' + (1 + Object.keys(others).length), 'Connection state: ' + ice,
    'Browser: ' + navigator.userAgent.slice(0, 90), '--- log ---', ...diag.slice(-14)].join('\n');
}
function updCount() { $('status').textContent = netText + ' · 👥 ' + (1 + Object.keys(others).length); }
function setNet(t) { netText = t; updCount(); }
$('status').onclick = () => {
  const pl = $('plist'); if (pl.style.display === 'block') { pl.style.display = 'none'; return; }
  const mkb = (t, fn) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.style.cssText = 'margin:6px 6px 0 0;padding:6px 10px;font-size:13px'; b.onclick = fn; return b; };
  const line = t => { const d = document.createElement('div'); d.textContent = t; return d; };
  const pre = document.createElement('pre'); pre.style.cssText = 'display:none;font-size:10px;white-space:pre-wrap;user-select:text;margin:6px 0 0'; pre.textContent = report();
  pl.replaceChildren(line('Cozy Sandbox ' + VERSION), ...[S.name + ' (you)', ...Object.values(others).map(o => o.name || 'Player')].map(n => line('🟢 ' + n)),
    mkb('🔧 Connection details', () => { pre.textContent = report(); pre.style.display = pre.style.display === 'none' ? 'block' : 'none'; }),
    mkb('📋 Copy report', e => { try { navigator.clipboard.writeText(report()); e.target.textContent = 'Copied!'; } catch (x) { e.target.textContent = 'Copy failed'; } }),
    mkb('🔄 Reconnect', () => location.reload()), pre);
  pl.style.display = 'block';
};
const MAXB = 60 * 1024 * 1024;
const send = o => { if (net) net(o); };
const PREFIX = 'cozysandbox-', ROOM = 'main-lobby-k7x2';
function handle(m) {
  if (m.t === 'welcome') { myId = m.id; blocks.forEach(b => scene.remove(b)); blocks.clear(); m.players.forEach(addOther); m.blocks.forEach(b => setBlock(b[0], b[1], b[2], b[3])); }
  else if (m.t === 'join') addOther(m);
  else if (m.t === 'leave') delOther(m.id);
  else if (m.t === 'state') { const o = others[m.id]; if (o) Object.assign(o, { x: m.x, y: m.y, z: m.z, ry: m.ry }); }
  else if (m.t === 'chat') { logMsg(m.name, m.text); remember(m.name, m.text); say(m.id === myId ? 'me' : m.id, m.text); }
  else if (m.t === 'hist') { chatLog = m.h.slice(-200); try { localStorage.setItem('cozychat', JSON.stringify(chatLog)); } catch (e) {} showHist(chatLog); }
  else if (m.t === 'fch') tubeGotChunk(m);
  else if (m.t === 'fnone') { delete dl[m.id]; setStat('The host does not have this video file right now.'); }
  else if (m.t === 'block') setBlock(m.x, m.y, m.z, m.c);
  else if (m.t === 'tubestate') { T = m.s; saveT(); tubeRender(); }
}
let lastErr = '', connecting = false;
function claim(id) {
  return new Promise(res => {
    dlog('Trying to host as ' + id);
    const peer = new Peer(id); let done = false;
    const fin = r => { if (!done) { done = true; clearTimeout(to); dlog('Host attempt: ' + r); res(r); } };
    const to = setTimeout(() => { lastErr = 'free relay did not answer'; try { peer.destroy(); } catch (e) {} fin('error'); }, 10000);
    peer.on('open', () => { fin('host'); startHost(peer); });
    peer.on('error', e => { dlog('Relay error: ' + e.type); if (!done) { try { peer.destroy(); } catch (x) {} if (e.type !== 'unavailable-id') lastErr = 'relay error: ' + e.type; fin(e.type === 'unavailable-id' ? 'taken' : 'error'); } });
  });
}
function join(id) {
  return new Promise(res => {
    dlog('Joining ' + id);
    const peer = new Peer(); let done = false;
    const fin = r => { if (!done) { done = true; clearTimeout(to); dlog('Join attempt: ' + r); if (!r) { hostConn = null; try { peer.destroy(); } catch (e) {} } res(r); } };
    const to = setTimeout(() => { lastErr = 'host did not answer (stale or blocked)'; fin(false); }, 9000);
    const fail = () => { if (done) { setNet('🔴 Disconnected, reconnecting…'); setTimeout(() => location.reload(), 3000); } else fin(false); };
    peer.on('error', e => { lastErr = 'join error: ' + e.type; dlog('Join error: ' + e.type); fail(); });
    peer.on('open', () => {
      const conn = peer.connect(id, { reliable: true }); hostConn = conn;
      conn.on('iceStateChanged', st => dlog('ICE: ' + st));
      conn.on('open', () => { net = o => conn.open && conn.send(o); setNet('🟢 Online'); net({ t: 'join', name: S.name, color: S.color }); fin(true); });
      conn.on('data', handle); conn.on('close', fail); conn.on('error', fail);
    });
  });
}
async function connect(retry) {
  if (connecting) return; connecting = true;
  try {
    dlog('Multiplayer library loaded: ' + (typeof Peer !== 'undefined'));
    if (typeof Peer === 'undefined') { lastErr = 'multiplayer library blocked or failed to load'; setNet('Solo (' + lastErr + ' - tap for details)'); return; }
    if (!retry) setNet('Connecting…');
    for (let slot = 0; slot < 5; slot++) {
      const id = PREFIX + ROOM + (slot ? '-' + slot : '');
      const r = await claim(id);
      if (r === 'host') return;
      if (r === 'taken') { setNet('Joining…'); if (await join(id)) return; continue; }
      break;
    }
    setNet('Solo (' + (lastErr || 'no lobby found') + ' - tap for details)');
    setTimeout(() => connect(true), 15000);
  } finally { connecting = false; }
}
function startHost(peer) {
  myId = 0; hostMode = true; let nid = 1; const peers = new Map();
  setNet('🟢 Online (host)');
  const bc = (o, ex) => peers.forEach(p => p.conn !== ex && p.conn.open && p.conn.send(o));
  dlog('Hosting the lobby');
  peer.on('disconnected', () => { dlog('Lost relay connection, reconnecting'); try { peer.reconnect(); } catch (e) {} });
  tubeBroadcast = () => bc({ t: 'tubestate', s: T });
  const pub = p => ({ id: p.id, name: p.name, color: p.color, x: p.x, y: p.y, z: p.z, ry: p.ry });
  net = o => {
    if (o.t === 'state') bc({ t: 'state', id: 0, x: o.x, y: o.y, z: o.z, ry: o.ry });
    else if (o.t === 'chat') { const m = { t: 'chat', id: 0, name: S.name, text: String(o.text).slice(0, 200) }; bc(m); handle(m); }
    else if (o.t === 'block') bc(o);
  };
  peer.on('connection', conn => {
    dlog('A player is connecting'); conn.on('iceStateChanged', st => dlog('ICE: ' + st));
    const p = { conn, id: nid++, name: 'Guest', color: '#ff9f5a', x: 0, y: 0, z: 6, ry: 0, joined: false };
    peers.set(p.id, p);
    conn.on('data', m => {
      if (m.t === 'join') {
        p.name = String(m.name || 'Guest').slice(0, 16);
        if (/^#[0-9a-f]{6}$/i.test(m.color)) p.color = m.color;
        p.joined = true;
        conn.send({ t: 'welcome', id: p.id,

      el('div', { style: 'flex:1' }, el('b', { textContent: x.title }), el('div', { textContent: `👁 ${x.views} · 👍 ${cnt(x.votes, 1)} · 👎 ${cnt(x.votes, -1)} · ${x.comments.length} comments · ${x.by}`, style: 'font-size:12px;opacity:.8' })))));
  } else if (!v) L.append(el('div', { textContent: 'Pick a video first to see its comments.' }));
  else if (!v.comments.length) L.append(el('div', { textContent: 'No comments yet. Be the first!' }));
  else v.comments.slice().reverse().forEach(c => L.append(el('div', { className: 'item' },
    el('div', {}, el('b', { textContent: c.name + ': ' }), c.text),
    el('div', { className: 'row', style: 'flex-shrink:0' }, tbtn('👍 ' + Object.keys(c.likes).length, () => tubeSend({ a: 'clike', id: v.id, cid: c.id }), c.likes[myUid]),
      ...(c.uid === myUid ? [tbtn('🗑', () => tubeSend({ a: 'cdel', id: v.id, cid: c.id }))] : [])))));
}
$('tvid').onerror = () => { const i = cur && vidOf(cur); setStat('This device cannot play that video (' + (i ? i.type : 'unknown format') + '). Try uploading an .mp4.'); };
function openTube() { document.exitPointerLock && document.exitPointerLock(); tubeOpen = true; $('tube').style.display = 'flex'; tubeRender(); }
function closeTube() { tubeOpen = false; $('tvid').pause(); $('tprev').pause(); $('tube').style.display = 'none'; }
$('btube').onclick = openTube; $('tclose').onclick = closeTube; $('brec').onclick = toggleRec;
$('trec').onclick = () => { closeTube(); toggleRec(); };
$('tup').onclick = () => $('tfile').click();
$('tfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) sniffType(f).then(t => setPending(f, f.name.replace(/\.[^.]+$/, ''), t)); };
$('tgo').onclick = postVideo;
$('tdis').onclick = () => { pending = null; $('tprev').pause(); tubeRender(); };
$('tpost').onclick = () => { const t = $('tcin').value.trim(); if (t && cur) { tubeSend({ a: 'comment', id: cur, text: t }); $('tcin').value = ''; } };
$('tcin').onkeydown = e => { if (e.key === 'Enter') $('tpost').click(); };
$('ttab1').onclick = () => { tab = 1; tubeRender(); }; $('ttab2').onclick = () => { tab = 2; tubeRender(); };
drawTV(); showHist(chatLog);

// ---------- main loop ----------
const sky = new THREE.Color(), skyDay = new THREE.Color(0x87ceeb), skyNight = new THREE.Color(0x3b4a85), v = new THREE.Vector3(), tmp = new THREE.Vector3();
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  step(dt);
  me.g.position.set(me.x, me.y, me.z); me.g.rotation.y = me.ry;
  for (const id in others) { const o = others[id]; o.g.position.lerp(tmp.set(o.x, o.y, o.z), Math.min(1, dt * 10)); o.g.rotation.y = o.ry; }
  if ((acc += dt) > .1) { acc = 0; send({ t: 'state', x: me.x, y: me.y, z: me.z, ry: me.ry }); }

  // shared day/night cycle (5 min), same for everyone
  const a = (Date.now() / 1000 / 300 % 1) * Math.PI * 2, sa = Math.sin(a), day = clamp(sa * 2 + .8, 0, 1);
  sun.position.set(me.x + Math.cos(a) * 50, Math.max(sa, .05) * 50 + 5, me.z + 30); sun.target.position.set(me.x, 0, me.z);
  sun.intensity = .4 + day * .8; hemi.intensity = .5 + day * .4;
  sky.copy(skyNight).lerp(skyDay, day); scene.background = sky; scene.fog.color.copy(sky);
  water.position.y = -.3 + Math.sin(now / 1000) * .03;

  const tx = me.x, ty = me.y + 1.5, tz = me.z, d = 6, cp = Math.cos(pitch);
  cam.position.set(tx + Math.sin(yaw) * cp * d, Math.max(ty + Math.sin(pitch) * d, .3), tz + Math.cos(yaw) * cp * d);
  cam.lookAt(tx, ty, tz);

  for (const id in labels) {
    const o = id === 'me' ? me : others[id]; if (!o) continue;
    v.set(o.x, o.y + 1.9, o.z).project(cam);
    const el = labels[id];
    if (v.z > 1) el.style.display = 'none';
    else { el.style.display = 'block'; el.style.left = (v.x * .5 + .5) * innerWidth + 'px'; el.style.top = (-v.y * .5 + .5) * innerHeight + 'px'; }
  }
  R.render(scene, cam);
}

// ---------- settings ----------
$('bset').onclick = () => {
  document.exitPointerLock && document.exitPointerLock();
  $('sname').value = S.name; $('scol').value = S.color; $('smode').value = S.mode; $('ssens').value = S.sens;
  $('ssh').value = S.shadows ? '1' : '0'; $('sfog').value = S.fog;
  $('set').style.display = 'flex';
};
$('sclose').onclick = () => $('set').style.display = 'none';
$('ssave').onclick = () => {
  S = { name: $('sname').value.trim() || S.name, color: $('scol').value, mode: $('smode').value, sens: +$('ssens').value,
        shadows: $('ssh').value === '1', fog: +$('sfog').value };
  try { localStorage.setItem('cozy', JSON.stringify(S)); } catch (e) {}
  location.reload();
};

updCount();
requestAnimationFrame(loop);
connect().catch(() => setNet('Solo (offline, tap to retry)'));
</script></body></html>
